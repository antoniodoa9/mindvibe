<!DOCTYPE html>
<!-- GRUPO I DE INGENIERIA DEL SOFTWARE -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Añadir dispositivo | MindVibe</title>
    <link rel="icon" th:href="@{/icono-mindvibe.png}">
    <link rel="stylesheet" th:href="@{/css/mindvibe.css}">
</head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>
<div class="panel-head">
    <div class="wrap">
        <h1>Añadir dispositivo</h1>
        <p>Alta de un casco EEG para un usuario</p>
    </div>
</div>
<main class="wrap" style="padding: 32px 24px 72px">
    <div class="card" style="max-width:520px">
        <h2>Usuario: <span th:text="${dispositivo.titular.nombre}">Usuario</span></h2>
        <form th:action="@{/dispositivo}" th:object="${dispositivo}" th:method="post">
            <label for="modelo">Modelo</label>
            <input type="text" th:field="*{modelo}" required />
            <label for="bateria">Batería</label>
            <input type="text" th:field="*{bateria}" required />
            <input type="hidden" th:field="*{titular.id}" /> <!-- Campo oculto para el ID del usuario -->
            <div class="form-actions">
                <a class="btn btn-ghost btn-sm" th:href="@{/listUsuario}">Cancelar</a>
                <button type="reset" class="btn btn-ghost btn-sm">Borrar</button>
                <button type="submit" class="btn btn-sm">Crear dispositivo</button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: pie}"></footer>
</body>
</html>
