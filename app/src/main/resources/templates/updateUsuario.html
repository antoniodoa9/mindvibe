<!DOCTYPE html>
<!-- GRUPO I DE INGENIERIA DEL SOFTWARE -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar usuario | MindVibe</title>
    <link rel="icon" th:href="@{/icono-mindvibe.png}">
    <link rel="stylesheet" th:href="@{/css/mindvibe.css}">
</head>
<body>
<header th:replace="~{fragments :: cabecera}"></header>
<div class="panel-head">
    <div class="wrap">
        <h1>Editar usuario</h1>
        <p>Modificación de los datos de un usuario</p>
    </div>
</div>
<main class="wrap" style="padding: 32px 24px 72px">
    <div class="card" style="max-width:520px">
        <form th:object="${usuario}" th:action="@{/usuario}" th:method="put">
            <label for="id">ID</label>
            <input type="number" th:field="*{id}" readonly />
            <label for="nombre">Nombre</label>
            <input type="text" th:field="*{nombre}" autofocus="autofocus" placeholder="Nombre" required />
            <label for="email">Email</label>
            <input type="email" th:field="*{email}" placeholder="Email" required />
            <div class="form-actions">
                <a class="btn btn-ghost btn-sm" th:href="@{/listUsuario}">Cancelar</a>
                <button type="submit" class="btn btn-sm">Guardar</button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments :: pie}"></footer>
</body>
</html>
